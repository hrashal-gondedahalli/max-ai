<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAX AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}
.app{width:min(850px,100%);height:min(850px,94vh);min-height:560px;background:#111a2e;border:1px solid #293653;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 70px #0006}
header{padding:20px;display:flex;align-items:center;gap:13px;border-bottom:1px solid #293653}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#8290ff,#45d7c5);display:grid;place-items:center;color:#10172a;font-size:27px;font-weight:900}h1{margin:0;font-size:21px;letter-spacing:2px}header p{margin:3px 0 0;color:#9eacc8;font-size:13px}
#chat{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}.welcome{text-align:center;margin:auto;max-width:480px}.welcome .star{font-size:48px;color:#91a0ff}.welcome h2{margin:5px}.welcome p{color:#aab6ce;line-height:1.6}.msg{max-width:80%;padding:13px 16px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#29385e}.bot{align-self:flex-start;background:#1a2741;border:1px solid #30405f}.tag{display:block;font-size:10px;letter-spacing:1px;color:#aab6ce;margin-bottom:5px}
form{display:flex;gap:9px;padding:14px;border-top:1px solid #293653}textarea{flex:1;resize:none;max-height:120px;border:1px solid #354462;border-radius:14px;background:#0b1325;color:#fff;padding:13px;font:inherit;outline:none}button{border:0;border-radius:13px;padding:0 17px;background:#8290ff;color:#10172a;font-weight:700;font-size:18px;cursor:pointer}.extras{display:flex;justify-content:flex-end;gap:18px;padding:0 18px 13px}.extras button{background:none;color:#aab6ce;font-size:12px;padding:4px}.note{text-align:center;color:#8190aa;font-size:11px;padding:0 10px 13px}
@media(max-width:600px){.app{height:94vh;min-height:500px}.msg{max-width:92%}}
</style>
</head>
<body><main class="app">
<header><div class="logo">M</div><div><h1>MAX AI</h1><p>Your assistant for questions, learning and ideas</p></div></header>
<section id="chat" aria-live="polite"><div class="welcome" id="welcome"><div class="star">✦</div><h2>Hello! I'm MAX.</h2><p>Type a message below. You can also use your device's microphone or ask MAX to repeat its last reply.</p></div></section>
<div class="extras"><button type="button" id="repeat">↻ Repeat last reply</button><button type="button" id="clear">Clear conversation</button></div>
<form id="form"><textarea id="input" rows="1" aria-label="Message MAX" placeholder="Message MAX…"></textarea><button aria-label="Send">➤</button></form>
<div class="note">Enter to send · Shift + Enter for a new line</div>
</main>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input');let lastReply='';
function add(role,text){document.getElementById('welcome')?.remove();const box=document.createElement('div');box.className='msg '+(role==='You'?'user':'bot');const tag=document.createElement('span');tag.className='tag';tag.textContent=role;const body=document.createElement('div');body.textContent=text;box.append(tag,body);chat.append(box);chat.scrollTop=chat.scrollHeight;}
function say(text){lastReply=text;if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-IN';speechSynthesis.speak(u);}}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;add('You',text);input.value='';const answer='Thanks for your message! The MAX website is running, but its AI answer engine has not been connected yet. A secure server and AI API connection are needed before MAX can generate answers like ChatGPT. Please do not put an API key in this webpage.';add('MAX',answer);say(answer);});
document.getElementById('repeat').addEventListener('click',()=>{if(lastReply)say(lastReply);else say('There is no reply to repeat yet.');});
document.getElementById('clear').addEventListener('click',()=>{chat.innerHTML='<div class="welcome" id="welcome"><div class="star">✦</div><h2>Hello! I\'m MAX.</h2><p>Type a message below. You can also use your device\'s microphone or ask MAX to repeat its last reply.</p></div>';lastReply='';speechSynthesis?.cancel();});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('form').requestSubmit();}});
</script></body></html>
